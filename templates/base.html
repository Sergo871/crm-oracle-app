<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Demo CRM{% endblock %} · Demo CRM</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6fdf'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>C</text></svg>">
</head>
<body>
{% if session.uid %}
<header class="top">
  <a class="brand" href="{{ url_for('dashboard') }}">Demo CRM</a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
  <label for="nav-toggle" class="burger" aria-label="Meniu">☰</label>
  <nav class="nav">
    {% for key, label in NAV %}
      <a href="{{ nav_url(key) }}" class="{{ 'on' if active == key }}">{{ label }}</a>
    {% endfor %}
    <form method="post" action="{{ url_for('logout') }}" class="logout">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button type="submit" class="link">Ieșire · {{ session.name }}</button>
    </form>
  </nav>
</header>
{% endif %}
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
