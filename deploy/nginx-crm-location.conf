# Se adauga in blocul "server { listen 443 ssl; server_name flask-hello-oracle.duckdns.org; ... }"
# din /etc/nginx/conf.d/flask-hello.conf, inainte de "location /".
    location = /crm { return 301 /crm/; }

    location /crm/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /crm;
    }
